spec:
  contents:
    openapi: 3.1.0
    info:
      title: OpenAPI definition
      version: v0
    servers:
      - url: http://localhost:8080
        description: Generated server url
    tags:
      - name: Analytics APIs
        description: Operations for Analytics System
      - name: Courses APIs
        description: Operations for Course Management System
      - name: Enrollment APIs
        description: Operations for Enrollment System
    paths:
      /enrollments/{id}/complete:
        put:
          tags:
            - Enrollment APIs
          summary: Complete Course
          description: Set status for course as 'COMPLETED'.
          operationId: complete
          parameters:
            - name: id
              in: path
              required: true
              schema:
                type: integer
                format: int32
          responses:
            "200":
              description: Completed Successfully.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/EnrollmentResponseDto"
            "404":
              description: Enrollment For Update Not Found
      /enrollments/{id}/cancel:
        put:
          tags:
            - Enrollment APIs
          summary: Cancel Enrollment
          description: Set status for enrollment as 'CANCELLED'.
          operationId: cancel
          parameters:
            - name: id
              in: path
              required: true
              schema:
                type: integer
                format: int32
          responses:
            "200":
              description: Cancelled Successfully.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/EnrollmentResponseDto"
            "404":
              description: Enrollment Not Found
      /courses/{id}:
        get:
          tags:
            - Courses APIs
          summary: Get Course By ID
          description: Get an course resource by ID reference.
          operationId: getCourseById
          parameters:
            - name: id
              in: path
              required: true
              schema:
                type: integer
                format: int32
          responses:
            "200":
              description: Fetched the required Course details.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/CourseResponseDto"
            "404":
              description: Course Not Found
        put:
          tags:
            - Courses APIs
          summary: Update Course
          description: Update Course Details.
          operationId: updateCourse
          parameters:
            - name: id
              in: path
              required: true
              schema:
                type: integer
                format: int32
          requestBody:
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CourseRequestDto"
            required: true
          responses:
            "200":
              description: Updated Successfully.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/CourseResponseDto"
            "404":
              description: Course Not Found
        delete:
          tags:
            - Courses APIs
          summary: Delete Course
          description: Delete Course Details.
          operationId: deleteCourse
          parameters:
            - name: id
              in: path
              required: true
              schema:
                type: integer
                format: int32
          responses:
            "200":
              description: Deleted Successfully.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/CourseResponseDto"
            "404":
              description: Course Not Found
      /enrollments:
        get:
          tags:
            - Enrollment APIs
          summary: Get All Enrollments
          description: Get all enrollment resources.
          operationId: getAll
          responses:
            "200":
              description: Fetched all Enrollments details.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/EnrollmentResponseDto"
        post:
          tags:
            - Enrollment APIs
          summary: Create Enrollment
          description: Create a new enrollment resource.
          operationId: create
          requestBody:
            description: Payload to create Enrollment resource
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/EnrollmentRequestDto"
            required: true
          responses:
            "201":
              description: Successfully created a new employee resource
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/EnrollmentResponseDto"
            "400":
              description: Course Capacity Full
            "404":
              description: Course Not Found
            "409":
              description: Already Enrolled
      /courses:
        get:
          tags:
            - Courses APIs
          summary: Get All Courses
          description: Get all course resources.
          operationId: getAllCourses
          responses:
            "200":
              description: Fetched all Course details.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/CourseResponseDto"
        post:
          tags:
            - Courses APIs
          summary: Create Course
          description: Create a new course resource.
          operationId: createCourse
          requestBody:
            description: Payload to create Course resource
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CourseRequestDto"
            required: true
          responses:
            "201":
              description: Successfully created a new copurse resource
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/CourseResponseDto"
      /enrollments/{id}:
        get:
          tags:
            - Enrollment APIs
          summary: Get Enrollment By ID
          description: Get an enrollment resource by ID reference.
          operationId: getById
          parameters:
            - name: id
              in: path
              required: true
              schema:
                type: integer
                format: int32
          responses:
            "200":
              description: Fetched the required Enrollment details.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/EnrollmentResponseDto"
            "404":
              description: Enrollment Not Found
      /enrollments/status/{status}:
        get:
          tags:
            - Enrollment APIs
          summary: Get Enrollments By Status
          description: Get all enrollment resources for status.
          operationId: getEnrollmentsByStatus
          parameters:
            - name: status
              in: path
              required: true
              schema:
                type: string
          responses:
            "200":
              description: Fetched the required Enrollments.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/EnrollmentResponseDto"
      /enrollments/employee/{employeeId}:
        get:
          tags:
            - Enrollment APIs
          summary: Get Enrollments By Employee ID
          description: Get all enrollment resources for employee ID.
          operationId: getEnrollmentsByEmployeeId
          responses:
            "200":
              description: Fetched the required Enrollments.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/EnrollmentResponseDto"
      /courses/trainer/{trainerName}:
        get:
          tags:
            - Courses APIs
          summary: Get Courses By Trainer Name
          description: Get all course resources for given trainer.
          operationId: getCoursesByTrainer
          parameters:
            - name: trainerName
              in: path
              required: true
              schema:
                type: string
          responses:
            "200":
              description: Fetched the required Courses.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/CourseResponseDto"
      /courses/fees/{amount}:
        get:
          tags:
            - Courses APIs
          summary: Get Courses By Fees Less Than
          description: Get all course resources for fees less than given fee amount.
          operationId: getCoursesByFeeLimit
          responses:
            "200":
              description: Fetched the required Courses.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/CourseResponseDto"
      /analytics/most-popular-course:
        get:
          tags:
            - Analytics APIs
          summary: Get Most Popular Course
          description: Get course with most enrollments.
          operationId: getMostPopularCourse
          responses:
            "200":
              description: Fetched the most popular course.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/CourseResponseDto"
      /analytics/enrollment-count:
        get:
          tags:
            - Analytics APIs
          summary: Get Enrollments Count
          description: Get total count of enrollments.
          operationId: getEnrollmentsCount
          responses:
            "200":
              description: Fetched the enrollments count.
              content:
                application/json:
                  schema:
                    type: integer
                    format: int32
      /analytics/course-count:
        get:
          tags:
            - Analytics APIs
          summary: Get Courses Count
          description: Get total count of courses.
          operationId: getCoursesCount
          responses:
            "200":
              description: Fetched the courses count.
              content:
                application/json:
                  schema:
                    type: integer
                    format: int32
    components:
      schemas:
        EnrollmentResponseDto:
          type: object
          properties:
            enrollmentId:
              type: integer
              format: int32
            employeeId:
              type: integer
              format: int32
            employeeName:
              type: string
            courseId:
              type: integer
              format: int32
            enrollmentDate:
              type: string
              format: date
            status:
              type: string
        CourseRequestDto:
          type: object
          properties:
            courseName:
              type: string
            trainerName:
              type: string
            durationInDays:
              type: integer
              format: int32
            maxCapacity:
              type: integer
              format: int32
            fees:
              type: number
              format: double
        CourseResponseDto:
          type: object
          properties:
            courseId:
              type: integer
              format: int32
            courseName:
              type: string
            trainerName:
              type: string
            durationInDays:
              type: integer
              format: int32
            maxCapacity:
              type: integer
              format: int32
            fees:
              type: number
              format: double
        EnrollmentRequestDto:
          type: object
          properties:
            employeeId:
              type: integer
              format: int32
            employeeName:
              type: string
            courseId:
              type: integer
              format: int32
